<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - النسخة البصرية الكاملة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --accent: #34a853; }
        [data-theme="dark"] { --primary: #8ab4f8; --bg: #121212; --card: #1e1e1e; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); text-align: center; padding: 20px; direction: rtl; transition: 0.3s; }
        .card { background: var(--card); max-width: 800px; margin: auto; padding: 40px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        /* تصميم جهاز قياس الصوت البصري */
        .visualizer-container {
            width: 100%;
            height: 100px;
            background: #000;
            border-radius: 15px;
            margin: 20px 0;
            overflow: hidden;
            display: none; /* يظهر فقط عند تفعيل المايك */
        }
        canvas { width: 100%; height: 100%; }

        .content-box { font-size: 1.8rem; padding: 30px; margin: 20px 0; background: rgba(26, 115, 232, 0.05); border-radius: 20px; border: 3px solid transparent; min-height: 120px; transition: 0.3s; }
        .listening-active { border-color: var(--accent); background: #e6f4ea; box-shadow: 0 0 20px rgba(52, 168, 83, 0.2); }
        
        .status-msg { font-weight: bold; color: var(--primary); margin-bottom: 15px; font-size: 1.1rem; }
        .btn-start { padding: 18px 45px; border-radius: 50px; border: none; background: var(--primary); color: white; cursor: pointer; font-size: 1.2rem; font-weight: bold; }
        .log-item { background: #fff; padding: 15px; margin-top: 10px; border-right: 6px solid var(--accent); text-align: right; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Viva EX - نظام التواصل البصري</h1>
        <div id="status" class="status-msg">يرجى رفع ملف الأسئلة PDF</div>

        <input type="file" id="file-input" accept=".pdf" style="display:none">
        <button id="start-btn" class="btn-start">📁 ارفع الملف وابدأ التجربة</button>

        <div id="main-ui" style="display:none">
            <div class="visualizer-container" id="v-container">
                <canvas id="canvas"></canvas>
            </div>
            
            <div class="content-box" id="display-text">المحتوى سيظهر هنا</div>
            
            <p style="opacity: 0.7;">أوامرك: [ اقرأ - التالي - ارجع - وقف - احفظ ]</p>
        </div>

        <div id="results-log" style="display:none; margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px;">
            <h3>الإجابات الموثقة بصرياً:</h3>
            <div id="log-container"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        let segments = [];
        let index = 0;
        let results = [];
        let isSystemSpeaking = false;
        
        const synth = window.speechSynthesis;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-SA';
        recognition.continuous = true;
        recognition.interimResults = true;

        // إعدادات المحلل البصري للصوت
        let audioCtx, analyser, dataArray, canvas, canvasCtx;

        async function initVisualizer() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                canvas = document.getElementById('canvas');
                canvasCtx = canvas.getContext('2d');
                draw();
            } catch (err) { console.error("المايك معطل أو مرفوض", err); }
        }

        function draw() {
            requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            
            let barWidth = (canvas.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;

            for(let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i] / 2;
                canvasCtx.fillStyle = isSystemSpeaking ? '#fbbc05' : '#34a853'; // أصفر للنظام، أخضر للطالب
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        document.getElementById('start-btn').onclick = () => document.getElementById('file-input').click();

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('main-ui').style.display = 'block';
            document.getElementById('v-container').style.display = 'block';
            document.getElementById('results-log').style.display = 'block';
            
            await initVisualizer(); // تفعيل المحلل البصري

            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(" ") + " ";
                }
                segments = fullText.split(/[.؟?]/).filter(s => s.trim().length > 5);
                updateUI();
                recognition.start();
                document.getElementById('status').innerText = "النظام يعمل.. قل 'اقرأ' للبدء";
            };
            reader.readAsArrayBuffer(file);
        };

        function updateUI() {
            document.getElementById('display-text').innerText = segments[index] || "نهاية الملف";
        }

        function speak(text) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            utter.onstart = () => {
                isSystemSpeaking = true;
                document.getElementById('display-text').classList.remove('listening-active');
                document.getElementById('status').innerText = "جاري القراءة بصوت مرتفع...";
            };
            utter.onend = () => {
                isSystemSpeaking = false;
                document.getElementById('display-text').classList.add('listening-active');
                document.getElementById('status').innerText = "تحدث الآن.. الميكروفون يسجل ذبذبات صوتك 🎤";
            };
            synth.speak(utter);
        }

        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }

            if (transcript.includes("وقف") || transcript.includes("اسكت")) {
                synth.cancel();
                isSystemSpeaking = false;
                return;
            }

            if (isSystemSpeaking) return;

            if (event.results[event.results.length - 1].isFinal) {
                const cmd = transcript.trim();
                if (cmd.includes("اقرأ")) speak(segments[index]);
                else if (cmd.includes("التالي")) { index++; updateUI(); speak(segments[index]); }
                else if (cmd.includes("ارجع")) { if(index > 0) index--; updateUI(); speak(segments[index]); }
                else if (cmd.includes("احفظ")) downloadReport();
                else if (cmd.length > 2) saveToLog(cmd);
            }
        };

        function saveToLog(ans) {
            results.push({ q: segments[index], a: ans });
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<b>السؤال:</b> ${segments[index]}<br><b>إجابتك:</b> <span style="color:var(--accent)">${ans}</span>`;
            document.getElementById('log-container').prepend(item);
        }

        function downloadReport() {
            let content = "Viva EX - تقرير الطالب النهائي\n\n" + results.map(r => `س: ${r.q}\nج: ${r.a}\n---`).join("\n");
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "viva_final_report.txt";
            a.click();
        }

        recognition.onend = () => recognition.start();
    </script>
</body>
</html>
