<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - نسخة نظيفة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); text-align: center; padding: 20px; direction: rtl; }
        .card { background: var(--card); max-width: 800px; margin: auto; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .question-number { background: #5f6368; color: white; padding: 5px 15px; border-radius: 50px; font-weight: bold; }
        .active-q { background: var(--primary) !important; }
        .content-box { font-size: 1.7rem; padding: 30px; margin: 20px 0; background: #e8f0fe; border-radius: 15px; min-height: 100px; border: 2px solid transparent; }
        .listening-mode { border-color: #34a853; background: #e6f4ea; }
        .status { color: #1a73e8; font-weight: bold; margin-bottom: 10px; height: 25px; }
        .btn-main { padding: 15px 40px; border-radius: 50px; border: none; background: var(--primary); color: white; cursor: pointer; font-size: 1.1rem; }
        .log-item { background: #fff; padding: 15px; margin-bottom: 10px; border-right: 5px solid #34a853; text-align: right; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Viva EX - نظام الإجابة الصافي</h1>
        <div id="status" class="status">يرجى رفع ملف الـ PDF</div>

        <input type="file" id="file-input" accept=".pdf" style="display:none">
        <button id="start-btn" class="btn-main">📁 ارفع الملف وابدأ</button>

        <div id="ui-elements" style="display:none">
            <span id="q-tag" class="question-number">سؤال رقم: <span id="q-num">1</span></span>
            <div class="content-box" id="display-text">المحتوى سيظهر هنا</div>
            <p style="font-size: 0.9rem; color: #666;">الأوامر الصوتية: [ اقرأ - التالي - ارجع - وقف - احفظ ]</p>
        </div>

        <div id="log-section" style="display:none; margin-top: 30px; border-top: 2px solid #ddd; padding-top: 20px;">
            <h3>سجل الإجابات (سؤال وجواب):</h3>
            <div id="log-container"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        let segments = [];
        let index = 0;
        let results = []; 
        let isSystemSpeaking = false; // متغير مهم لمنع تسجيل صوت النظام

        const synth = window.speechSynthesis;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

        recognition.lang = 'ar-SA';
        recognition.continuous = true;
        recognition.interimResults = true;

        document.getElementById('start-btn').onclick = () => document.getElementById('file-input').click();

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('ui-elements').style.display = 'block';
            document.getElementById('log-section').style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(" ") + " ";
                }
                segments = fullText.split(/[.؟?]/).filter(s => s.trim().length > 5);
                updateUI();
                recognition.start();
                document.getElementById('status').innerText = "النظام جاهز للاستماع";
            };
            reader.readAsArrayBuffer(file);
        };

        function updateUI() {
            document.getElementById('q-num').innerText = index + 1;
            document.getElementById('display-text').innerText = segments[index] || "نهاية الملف";
        }

        function speak(text) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            
            utter.onstart = () => {
                isSystemSpeaking = true; // النظام بدأ يتكلم
                document.getElementById('status').innerText = "النظام يقرأ الآن... 🔊";
                document.getElementById('display-text').classList.remove('listening-mode');
            };

            utter.onend = () => {
                isSystemSpeaking = false; // النظام سكت، الآن نسمع الطالب
                document.getElementById('status').innerText = "انتهيت.. أنا أسمع إجابتك الآن 🎤";
                document.getElementById('display-text').classList.add('listening-mode');
            };

            synth.speak(utter);
        }

        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }

            // ميزة التوقف الفوري (تعمل حتى لو كان النظام يتكلم)
            if (transcript.includes("وقف") || transcript.includes("اسكت")) {
                synth.cancel();
                isSystemSpeaking = false;
                return;
            }

            // إذا كان النظام يتكلم، نتجاهل أي شيء آخر (عشان ما يسجل صوته كإجابة)
            if (isSystemSpeaking) return;

            // معالجة الأوامر والإجابات فقط بعد انتهاء الطالب من الكلام (isFinal)
            if (event.results[event.results.length - 1].isFinal) {
                const cleanText = transcript.trim();
                
                if (cleanText.includes("اقرأ")) {
                    speak(segments[index]);
                } 
                else if (cleanText.includes("التالي") || cleanText.includes("بعده")) {
                    if (index < segments.length - 1) {
                        index++;
                        updateUI();
                        speak(segments[index]);
                    }
                } 
                else if (cleanText.includes("ارجع") || cleanText.includes("قبل")) {
                    if (index > 0) {
                        index--;
                        updateUI();
                        speak(segments[index]);
                    }
                }
                else if (cleanText.includes("احفظ")) {
                    downloadFile();
                }
                else if (cleanText.length > 2) {
                    // تسجيل الإجابة (هنا نضمن أنها صوت الطالب فقط)
                    saveAnswer(cleanText);
                }
            }
        };

        function saveAnswer(text) {
            const qText = segments[index];
            const qNum = index + 1;

            results.push({ n: qNum, q: qText, a: text });

            const container = document.getElementById('log-container');
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `<b>سؤال (${qNum}):</b> ${qText}<br><b>الإجابة:</b> <span style="color:green">${text}</span>`;
            container.prepend(div);
            
            document.getElementById('status').innerText = "تم تسجيل إجابة السؤال " + qNum;
        }

        function downloadFile() {
            let content = "تقرير إجابات الطالب - Viva EX\n\n";
            results.forEach(r => {
                content += `السؤال ${r.n}: ${r.q}\nإجابة الطالب: ${r.a}\n------------------\n`;
            });
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "viva_report.txt";
            a.click();
        }

        recognition.onend = () => recognition.start();
    </script>
</body>
</html>
