<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - استجابة فورية</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --stop: #ea4335; }
        [data-theme="dark"] { --primary: #8ab4f8; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; text-align: center; padding: 20px; transition: 0.3s; }
        .card { background: var(--card); max-width: 800px; margin: 20px auto; padding: 40px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .mic-indicator { width: 60px; height: 60px; border-radius: 50%; background: #34a853; margin: 20px auto; display: flex; align-items: center; justify-content: center; color: white; transition: 0.3s; }
        .speaking { background: #fbbc05; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .content-box { font-size: 1.6rem; padding: 30px; border-radius: 20px; background: rgba(26, 115, 232, 0.05); margin: 25px 0; border: 1px solid #ddd; }
        .command-hint { font-size: 0.85rem; color: #666; font-weight: bold; }
        button#start-btn { padding: 15px 40px; border-radius: 50px; border: none; background: var(--primary); color: white; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Viva EX Voice Instant</h1>
        <p>نظام التحكم اللحظي - قل "وقف" في أي وقت</p>

        <input type="file" id="file-input" accept=".pdf" style="display:none">
        <button id="start-btn">📁 ارفع الملف وابدأ التحكم</button>

        <div id="mic" class="mic-indicator" style="display:none">🎤</div>
        
        <div id="status" style="margin: 15px 0; font-weight: bold; color: var(--primary);">بانتظار رفع الـ PDF...</div>

        <div class="content-box" id="display-text">المحتوى سيظهر هنا</div>

        <div class="command-hint">الأوامر السريعة: [ اقرأ ] - [ التالي ] - [ ارجع ] - [ **وقف** ] - [ احفظ ]</div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        let segments = [];
        let index = 0;
        let answers = [];
        const synth = window.speechSynthesis;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

        recognition.lang = 'ar-SA';
        recognition.continuous = true;
        recognition.interimResults = true; // تفعيل النتائج المؤقتة لسرعة الاستجابة

        document.getElementById('start-btn').onclick = () => document.getElementById('file-input').click();

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('mic').style.display = 'flex';
            document.getElementById('status').innerText = "جاري المعالجة...";

            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(" ") + " ";
                }
                segments = fullText.split(/[.؟?]/).filter(s => s.trim().length > 3);
                
                document.getElementById('status').innerText = "النظام مستعد تماماً ⚡";
                updateUI();
                recognition.start();
                announce("تم التحميل. قل اقرأ للبدء.");
            };
            reader.readAsArrayBuffer(file);
        };

        function updateUI() {
            document.getElementById('display-text').innerText = segments[index] || "نهاية الملف";
        }

        function announce(text) {
            synth.cancel(); // إلغاء أي صوت سابق
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-SA';
            utter.onstart = () => document.getElementById('mic').classList.add('speaking');
            utter.onend = () => document.getElementById('mic').classList.remove('speaking');
            synth.speak(utter);
        }

        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }
            
            console.log("السمع الحالي:", transcript);

            // أمر التوقف اللحظي (Priority One)
            if (transcript.includes("وقف") || transcript.includes("اسكت") || transcript.includes("خلاص")) {
                synth.cancel();
                document.getElementById('status').innerText = "تم الإيقاف فوراً 🛑";
                return;
            }

            // معالجة الأوامر فقط عند اكتمال الجملة (isFinal) لضمان الدقة
            if (event.results[event.results.length - 1].isFinal) {
                const command = transcript.trim();
                
                if (command.includes("اقرأ")) {
                    announce(segments[index]);
                } 
                else if (command.includes("التالي") || command.includes("بعده")) {
                    if (index < segments.length - 1) {
                        index++;
                        updateUI();
                        announce(segments[index]);
                    }
                } 
                else if (command.includes("ارجع") || command.includes("قبل")) {
                    if (index > 0) {
                        index--;
                        updateUI();
                        announce(segments[index]);
                    }
                }
                else if (command.includes("احفظ")) {
                    download();
                }
                else {
                    // تسجيل إجابة تلقائية
                    answers.push(`س: ${segments[index]} | ج: ${command}`);
                    document.getElementById('status').innerText = "سجلت إجابتك: " + command;
                }
            }
        };

        recognition.onerror = () => recognition.start();
        recognition.onend = () => recognition.start();

        function download() {
            const blob = new Blob([answers.join("\n")], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "viva_ex_report.txt";
            a.click();
        }
    </script>
</body>
</html>
