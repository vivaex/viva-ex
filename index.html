<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - منصة الصم الذكية</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #1a73e8;
            --text-secondary: #5f6368;
            --border-color: #1a73e8;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #8ab4f8;
            --text-secondary: #bdc1c6;
            --border-color: #8ab4f8;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            transition: 0.3s;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .toolbar {
            position: fixed;
            top: 20px;
            display: flex;
            gap: 10px;
        }

        button.tool-btn {
            background: var(--card-bg);
            border: 1px solid var(--text-primary);
            color: var(--text-primary);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%;
            max-width: 500px;
            transition: 0.3s;
        }

        h1 { color: var(--text-primary); font-size: 2.5rem; margin-bottom: 5px; }
        p { color: var(--text-secondary); font-size: 1.1rem; }

        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            padding: 40px;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .upload-box:hover { background-color: rgba(26, 115, 232, 0.1); }
        
        #file-name { 
            margin-top: 20px; 
            font-weight: bold; 
            color: #34a853; 
            min-height: 24px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="tool-btn" onclick="toggleTheme()">تبديل الوضع 🌓</button>
        <button class="tool-btn" onclick="changeFontSize(2)">خط أكبر +</button>
        <button class="tool-btn" onclick="changeFontSize(-2)">خط أصغر -</button>
    </div>

    <div class="card" id="mainCard">
        <h1>Viva EX</h1>
        <p id="description">منصتك الذكية لترجمة ومعالجة ملفات الصم</p>
        
        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" width="60" alt="pdf icon">
            <p>اسحب ملف الـ PDF هنا أو اضغط للاختيار</p>
            <input type="file" id="file-input" accept=".pdf" hidden>
        </div>
        
        <div id="file-name"></div>
        
        <div class="footer-note">مشروع Viva EX لدعم لغة الإشارة والتواصل البصري</div>
    </div>

    <script>
        // تغيير الوضع (ليلي/نهاري)
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        // تغيير حجم الخط للمحتوى
        let currentSize = 1.1;
        function changeFontSize(delta) {
            const desc = document.getElementById('description');
            const style = window.getComputedStyle(desc).getPropertyValue('font-size');
            const fontSize = parseFloat(style);
            desc.style.fontSize = (fontSize + delta) + 'px';
        }

        // إظهار اسم الملف المرفوع
        const input = document.getElementById('file-input');
        const nameDisplay = document.getElementById('file-name');

        input.onchange = () => {
            if (input.files.length > 0) {
                nameDisplay.innerText = "✅ تم تحميل: " + input.files[0].name;
            }
        };
    </script>
</body>
</html>
