<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - التفاعل الذكي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --text: #202124; --accent: #ea4335; }
        [data-theme="dark"] { --primary: #8ab4f8; --bg: #121212; --card: #1e1e1e; --text: #e8eaed; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; text-align: center; padding: 20px; margin: 0; }
        .card { background: var(--card); max-width: 700px; margin: 20px auto; padding: 30px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; transition: 0.2s; font-size: 1rem; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-stop { background: var(--accent); }
        .btn-voice { background: #34a853; }
        
        .content-area { margin-top: 20px; border: 2px solid #eee; padding: 20px; border-radius: 15px; min-height: 120px; text-align: right; overflow-y: auto; max-height: 250px; line-height: 1.6; }
        .answers-section { margin-top: 30px; text-align: right; }
        .answer-item { background: #e8f0fe; padding: 10px 15px; border-radius: 10px; margin-bottom: 10px; border-right: 5px solid var(--primary); animation: slideIn 0.3s ease; }
        
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .status { font-size: 0.9rem; color: #1a73e8; margin: 10px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Viva EX Voice Control</h1>
        <p>تحكم بالقراءة، أوقف الصوت، وسجل إجاباتك</p>

        <div class="controls">
            <button class="btn" onclick="document.getElementById('file-input').click()">📁 ارفع ملف PDF</button>
            <input type="file" id="file-input" accept=".pdf" hidden>
            <button class="btn" onclick="toggleTheme()">🌓 النمط</button>
        </div>

        <div class="content-area" id="pdf-text">بانتظار رفع الملف...</div>
        
        <div id="status" class="status"></div>

        <div class="controls" style="margin-top: 20px;">
            <button class="btn" onclick="speakText()">🔊 بدء القراءة</button>
            <button class="btn btn-stop" onclick="stopSpeaking()">🛑 إيقاف مؤقت</button>
            <button class="btn btn-voice" id="start-record">🎤 تسجيل إجابة</button>
        </div>

        <div class="answers-section">
            <h3>إجاباتك المسجلة:</h3>
            <div id="answers-list">
                </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        let extractedText = "";
        let synth = window.speechSynthesis;

        // 1. استخراج النص
        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('status').innerText = "جاري استخراج النص...";
            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += textContent.items.map(item => item.str).join(" ") + " ";
                }
                extractedText = fullText;
                document.getElementById('pdf-text').innerText = extractedText;
                document.getElementById('status').innerText = "تم التحميل بنجاح ✅";
            };
            reader.readAsArrayBuffer(file);
        };

        // 2. القراءة الصوتية
        function speakText() {
            if (!extractedText) return alert("ارفع ملف أولاً!");
            stopSpeaking(); // تنظيف أي صوت شغال
            const utterance = new SpeechSynthesisUtterance(extractedText);
            utterance.lang = 'ar-SA';
            synth.speak(utterance);
            document.getElementById('status').innerText = "جاري القراءة الآن... 🔊";
        }

        // 3. زر الإيقاف (طلبك الأساسي)
        function stopSpeaking() {
            if (synth.speaking) {
                synth.cancel();
                document.getElementById('status').innerText = "تم إيقاف القراءة 🛑";
            }
        }

        // 4. تسجيل الإجابة الصوتية وإضافتها للقائمة
        const recordBtn = document.getElementById('start-record');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';

            recordBtn.onclick = () => {
                stopSpeaking(); // نوقف القراءة تلقائياً لما يبدأ يسجل
                recognition.start();
                document.getElementById('status').innerText = "أنا أسمعك الآن... تكلّم";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                addAnswerToList(transcript);
                document.getElementById('status').innerText = "تم تسجيل إجابتك ✅";
            };
        }

        function addAnswerToList(text) {
            const list = document.getElementById('answers-list');
            const newAnswer = document.createElement('div');
            newAnswer.className = 'answer-item';
            newAnswer.innerText = text;
            list.prepend(newAnswer); // يضيف الإجابة الجديدة في البداية
        }

        function toggleTheme() {
            document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
