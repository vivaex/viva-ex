<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - منصة التعليم التفاعلية الذكية للصم</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --primary: #1a73e8; /* Cobalt Blue */
            --secondary: #34a853; /* Emerald Green */
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #202124;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        header h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 5px; }

        /* المحلل البصري للذبذبات */
        .visualizer-box {
            width: 100%;
            height: 80px;
            background: #000;
            border-radius: 15px;
            margin: 15px 0;
            overflow: hidden;
            border: 3px solid #333;
        }
        canvas { width: 100%; height: 100%; }

        /* صندوق المحتوى */
        .content-display {
            font-size: 1.6rem;
            padding: 30px;
            background: rgba(26, 115, 232, 0.05);
            border: 3px solid transparent;
            border-radius: 20px;
            margin-bottom: 15px;
            min-height: 120px;
            line-height: 1.6;
            transition: 0.3s;
        }
        .listening-active { border-color: var(--secondary); background: #e6f4ea; }

        /* مصفوفة الرموز التعبيرية والردود السريعة */
        .pictogram-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .pictogram-btn {
            background: var(--card-bg);
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .pictogram-btn:hover { border-color: var(--primary); transform: translateY(-3px); }
        .pictogram-btn img { width: 50px; height: 50px; margin-bottom: 5px; }
        .pictogram-btn span { font-size: 0.9rem; font-weight: bold; }

        /* أزرار الحالة */
        .status-msg { font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 1rem; }
        .btn-main { padding: 15px 35px; border-radius: 50px; border: none; background: var(--primary); color: white; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
        
        /* سجل الإجابات */
        .log-section { text-align: right; border-top: 2px solid #eee; padding-top: 20px; }
        .log-item { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-right: 5px solid var(--secondary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Viva EX</h1>
            <p>منصة التعليم الذكي والوصول الشامل للصم</p>
        </header>

        <div id="setup-view">
            <input type="file" id="file-input" accept=".pdf" class="hidden">
            <button class="btn-main" onclick="document.getElementById('file-input').click()">📁 ارفع ملف PDF للبدء</button>
        </div>

        <div id="app-view" class="hidden">
            <div id="status" class="status-msg">يرجى الانتظار، جاري التحميل...</div>
            
            <div class="visualizer-box">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="content-display" id="display-text">المحتوى يظهر هنا</div>

            <div class="pictogram-matrix">
                <button class="pictogram-btn" onclick="saveAnswer('صح')">
                    <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" alt="صح">
                    <span>صح</span>
                </button>
                <button class="pictogram-btn" onclick="saveAnswer('خطأ')">
                    <img src="https://cdn-icons-png.flaticon.com/512/190/190406.png" alt="خطأ">
                    <span>خطأ</span>
                </button>
                <button class="pictogram-btn" onclick="saveAnswer('نعم')">
                    <img src="https://cdn-icons-png.flaticon.com/512/10476/10476686.png" alt="نعم">
                    <span>نعم</span>
                </button>
                <button class="pictogram-btn" onclick="saveAnswer('لا')">
                    <img src="https://cdn-icons-png.flaticon.com/512/10476/10476684.png" alt="لا">
                    <span>لا</span>
                </button>
                <button class="pictogram-btn" onclick="saveAnswer('أوافق')">
                    <img src="https://cdn-icons-png.flaticon.com/512/2343/2343277.png" alt="أوافق">
                    <span>أوافق</span>
                </button>
                <button class="pictogram-btn" onclick="downloadFile()">
                    <img src="https://cdn-icons-png.flaticon.com/512/11186/11186982.png" alt="حفظ">
                    <span>احفظ</span>
                </button>
            </div>
        </div>

        <div id="log-section" class="log-section hidden">
            <h3>سجل الإجابات الموثقة بصرياً وصوتياً:</h3>
            <div id="log-container"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let segments = [];
        let index = 0;
        let results = []; 
        let isSpeaking = false;

        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-SA';
        recognition.continuous = true;
        recognition.interimResults = true;

        let audioCtx, analyser, dataArray, canvas, canvasCtx;

        async function initVisualizer() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                canvas = document.getElementById('visualizer');
                canvasCtx = canvas.getContext('2d');
                drawVisualizer();
            } catch (err) { console.error("Visualizer Init Error", err); }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);
            canvasCtx.fillStyle = '#000';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            let barWidth = (canvas.width / dataArray.length) * 2.5;
            let barHeight, x = 0;
            for(let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i] / 1.5;
                canvasCtx.fillStyle = isSpeaking ? '#fbbc05' : '#34a853';
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('log-section').classList.remove('hidden');

            await initVisualizer();

            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(" ") + " ";
                }
                segments = fullText.split(/[.؟?]/).filter(s => s.trim().length > 5);
                updateUI();
                recognition.start();
                announce("تم التحميل. قل 'اقرأ' أو استخدم الرموز للإجابة.");
            };
            reader.readAsArrayBuffer(file);
        };

        function updateUI() {
            document.getElementById('display-text').innerText = segments[index] || "نهاية الملف";
        }

        function announce(text) {
            synth.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'ar-SA';
            ut.onstart = () => { isSpeaking = true; document.getElementById('status').innerText = "جاري القراءة بصوت مرتفع... 🔊"; document.getElementById('display-text').classList.remove('listening-active'); };
            ut.onend = () => { isSpeaking = false; document.getElementById('status').innerText = "تحدث الآن 🎤 أو استخدم الرموز بصرياً 👇"; document.getElementById('display-text').classList.add('listening-active'); };
            synth.speak(ut);
        }

        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) transcript += event.results[i][0].transcript;

            if (transcript.includes("وقف") || transcript.includes("اسكت")) { synth.cancel(); isSpeaking = false; return; }
            if (isSpeaking) return;

            if (event.results[event.results.length - 1].isFinal) {
                const cmd = transcript.trim();
                if (cmd.includes("اقرأ")) announce(segments[index]);
                else if (cmd.includes("التالي")) { index++; updateUI(); announce(segments[index]); }
                else if (cmd.includes("ارجع")) { if(index > 0) index--; updateUI(); speak(segments[index]); }
                else if (cmd.includes("احفظ")) downloadFile();
                else if (cmd.length > 2) saveAnswer(cmd);
            }
        };

        function saveAnswer(ans) {
            const q = segments[index];
            results.push({ q: q, a: ans });
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<b>سؤال:</b> ${q}<br><b>إجابة:</b> <span style="color:var(--secondary)">${ans}</span>`;
            document.getElementById('log-container').prepend(item);
            document.getElementById('status').innerText = "تم حفظ الإجابة بنجاح ✅ (صح)";
            // بعد حفظ الرد، هل ننتقل؟ اختياري.
            // if (ans === 'صح' || ans === 'خطأ') { index++; updateUI(); announce(segments[index]); }
        }

        function downloadFile() {
            let content = "Viva EX - تقرير الطالب التفاعلي\n\n" + results.map((r,i) => `${i+1}) س: ${r.q}\n   ج: ${r.a}\n---`).join("\n");
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "viva_exam_report.txt"; a.click();
        }

        recognition.onend = () => recognition.start();
    </script>
</body>
</html>
