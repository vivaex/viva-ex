<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - منصة الصم</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; }
        .upload-box {
            border: 2px dashed #1a73e8;
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-box:hover { background-color: #e8f0fe; }
        #file-name { margin-top: 15px; font-weight: bold; color: #188038; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Viva EX</h1>
        <p>مرحباً بك.. ارفع ملف الـ PDF لترجمته أو معالجته</p>
        
        <div class="upload-box" onclick="document.getElementById('file-input').click()">
            <img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" width="50" alt="pdf icon">
            <p>اضغط هنا لاختيار ملف</p>
            <input type="file" id="file-input" accept=".pdf" hidden>
        </div>
        
        <div id="file-name"></div>
    </div>

    <script>
        const input = document.getElementById('file-input');
        const nameDisplay = document.getElementById('file-name');

        input.onchange = () => {
            if (input.files.length > 0) {
                nameDisplay.innerText = "تم اختيار: " + input.files[0].name;
            }
        };
    </script>
</body>
</html>
