<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - التفاعل الصوتي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --text: #202124; }
        [data-theme="dark"] { --primary: #8ab4f8; --bg: #121212; --card: #1e1e1e; --text: #e8eaed; }
        
        body { font-family: sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; text-align: center; padding: 20px; }
        .card { background: var(--card); max-width: 600px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; background: var(--primary); color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-voice { background: #ea4335; } /* لون أحمر للتسجيل */
        .content-area { margin-top: 20px; border: 1px solid #ddd; padding: 15px; border-radius: 10px; min-height: 100px; text-align: right; overflow-y: auto; max-height: 200px; }
        .status { font-size: 0.9rem; color: #34a853; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn" onclick="toggleTheme()">🌓 وضع ليلي</button>
        <button class="btn" onclick="document.getElementById('file-input').click()">📁 ارفع PDF</button>
        <input type="file" id="file-input" accept=".pdf" hidden>
    </div>

    <div class="card">
        <h1>Viva EX Voice</h1>
        <p>تحكم بالملف عبر صوتك واسمعه ينطق</p>

        <div class="content-area" id="pdf-text">سيظهر نص الـ PDF هنا بعد الرفع...</div>
        
        <div class="controls" style="margin-top: 20px;">
            <button class="btn" onclick="speakText()">🔊 اقرأ لي الملف</button>
            <button class="btn btn-voice" id="start-record">🎤 ابدأ التحدث (الإجابة)</button>
        </div>

        <div id="status" class="status"></div>
        <div id="user-answer" style="margin-top: 15px; font-style: italic; color: #1a73e8;"></div>
    </div>

    <script>
        // إعداد مكتبة PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let extractedText = "";

        // 1. استخراج النص من الـ PDF
        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "جاري قراءة الملف...";
            const reader = new FileReader();
            reader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                let fullText = "";
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    fullText += textContent.items.map(item => item.str).join(" ") + "\n";
                }
                
                extractedText = fullText;
                document.getElementById('pdf-text').innerText = extractedText || "لا يوجد نص قابل للقراءة في هذا الملف.";
                document.getElementById('status').innerText = "تم استخراج النص بنجاح ✅";
            };
            reader.readAsArrayBuffer(file);
        };

        // 2. ميزة قراءة النص (Text-to-Speech)
        function speakText() {
            if (!extractedText) {
                alert("يرجى رفع ملف أولاً!");
                return;
            }
            const utterance = new SpeechSynthesisUtterance(extractedText);
            utterance.lang = 'ar-SA'; // لغة عربية
            window.speechSynthesis.speak(utterance);
        }

        // 3. ميزة التعرف على الصوت (Speech-to-Text)
        const recordBtn = document.getElementById('start-record');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-SA';

        recordBtn.onclick = () => {
            recognition.start();
            document.getElementById('status').innerText = "جاري الاستماع إليك... تكلّم الآن";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('user-answer').innerText = "إجابتك المسجلة: " + transcript;
            document.getElementById('status').innerText = "تم استلام الصوت بنجاح ✅";
        };

        function toggleTheme() {
            document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
