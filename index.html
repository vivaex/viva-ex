<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viva EX - Hands Free</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --card: #ffffff; --text: #202124; }
        [data-theme="dark"] { --primary: #8ab4f8; --bg: #121212; --card: #1e1e1e; --text: #e8eaed; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 20px; margin: 0; transition: 0.3s; }
        .card { background: var(--card); max-width: 800px; margin: 20px auto; padding: 40px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 2px solid var(--primary); }
        .mic-status { width: 80px; height: 80px; border-radius: 50%; background: #ea4335; margin: 20px auto; display: flex; align-items: center; justify-content: center; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(234, 67, 53, 0); } 100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0); } }
        .listening { background: #34a853 !important; }
        .content-box { font-size: 1.5rem; padding: 25px; border-radius: 15px; background: rgba(26, 115, 232, 0.1); margin: 20px 0; min-height: 100px; line-height: 1.8; }
        .help-box { font-size: 0.9rem; opacity: 0.8; background: #eee; padding: 10px; border-radius: 10px; color: #333; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Viva EX AI</h1>
        <p>ارفع الملف مرة واحدة.. ثم تحكم بصوتك فقط</p>

        <input type="file" id="file-input" accept=".pdf" class="hidden">
        <button id="upload-btn" style="padding: 15px 30px; border-radius: 50px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer;">📁 اضغط هنا لرفع الملف والبدء</button>

        <div id="mic-indicator" class="mic-status hidden">🎤</div>
        
        <div id="status" style="font-weight: bold; margin: 15px 0;">بانتظار الملف...</div>

        <div class="content-box" id="display-text">المحتوى سيظهر هنا</div>

        <div class="help-box">
            الأوامر الصوتية المتاحة: 
            <b>[ اقرأ ] - [ التالي ] - [ ارجع ] - [ وقف ] - [ احفظ ]</b>
            <br> (أي كلام آخر سيسجل كإجابة للسؤال الحالي)
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        
        let segments = [];
        let index = 0;
        let finalAnswers = [];
        let isSpeaking = false;

        const synth = window.speechSynthesis;
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        
        recognition.lang = 'ar-SA';
        recognition.continuous = true;
        recognition.interimResults = false;

        // بدء العملية
        document.getElementById('upload-btn').onclick = () => document.getElementById('file-input').click();

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('upload-btn').classList.add('hidden');
            document.getElementById('mic-indicator').classList.remove('hidden');
            document.getElementById('status').innerText = "جاري معالجة الملف...";

            const reader = new FileReader();
            reader.onload = async function() {
                const pdf = await pdfjsLib.getDocument(new Uint8Array(this.result)).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(" ") + " ";
                }
                segments = fullText.split(/[.؟?]/).filter(s => s.trim().length > 3);
                
                document.getElementById('status').innerText = "تم التجهيز! أنا أسمعك الآن...";
                document.getElementById('mic-indicator').classList.add('listening');
                updateUI();
                startListening();
                announce("تم تجهيز الملف. يمكنك الآن قول اقرأ أو التالي.");
            };
            reader.readAsArrayBuffer(file);
        };

        function updateUI() {
            document.getElementById('display-text').innerText = segments[index] || "انتهى الملف";
        }

        function announce(msg) {
            isSpeaking = true;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            utter.lang = 'ar-SA';
            utter.onend = () => { 
                isSpeaking = false; 
                try { recognition.start(); } catch(e) {} // إعادة تشغيل الميكروفون بعد السكوت
            };
            recognition.stop(); // إيقاف الميكروفون أثناء الكلام لعدم التداخل
            synth.speak(utter);
        }

        function startListening() {
            try { recognition.start(); } catch(e) {}
        }

        recognition.onresult = (event) => {
            if (isSpeaking) return;
            const command = event.results[event.results.length - 1][0].transcript.trim();
            console.log("الكلمة المسموعة:", command);

            if (command.includes("اقرأ") || command.includes("اسمع")) {
                announce(segments[index]);
            } 
            else if (command.includes("التالي") || command.includes("بعده")) {
                if (index < segments.length - 1) {
                    index++;
                    updateUI();
                    announce("السؤال التالي: " + segments[index]);
                } else {
                    announce("هذا هو السؤال الأخير");
                }
            } 
            else if (command.includes("ارجع") || command.includes("قبل")) {
                if (index > 0) {
                    index--;
                    updateUI();
                    announce(segments[index]);
                }
            }
            else if (command.includes("احفظ")) {
                download();
                announce("تم حفظ ملف الإجابات بنجاح");
            }
            else if (command.includes("وقف") || command.includes("اسكت")) {
                synth.cancel();
            }
            else {
                // تسجيل إجابة
                finalAnswers.push(`السؤال: ${segments[index]} | الإجابة: ${command}`);
                document.getElementById('status').innerText = "تم تسجيل إجابة للسؤال الحالي ✅";
                // بعد تسجيل الإجابة، هل تريد الانتقال تلقائياً؟
                // index++; updateUI(); announce("تم الحفظ. السؤال التالي: " + segments[index]);
            }
        };

        // لضمان بقاء الميكروفون يعمل دائماً
        recognition.onend = () => { if (!isSpeaking) recognition.start(); };

        function download() {
            const blob = new Blob(["تقرير Viva EX:\n\n" + finalAnswers.join("\n")], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "viva_report.txt";
            a.click();
        }
    </script>
</body>
</html>
